<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ember and Rime">
  <title>Ember &amp; Rime</title>
  <!--
    The tile is split down the middle: the left half is the X, burning; the
    right half is the O, frozen. The X's corners sit at the heights where the
    circle is narrowest, so the two marks interlock across the seam instead of
    merely standing beside each other.

    Drawn on a dark plate rather than transparent: pale rime on a light tab
    strip all but disappears, and the plate also matches the board itself.
    Colours are the game's own — molten #ff5a1f, rime #5fd8ff.
  -->
  <defs>
    <linearGradient id="er-plate" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161f2b"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="er-fire" x1="8" y1="19" x2="30" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff8a32"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <linearGradient id="er-ice" x1="36" y1="18" x2="56" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="0.5" stop-color="#8ce4ff"/>
      <stop offset="1" stop-color="#45c4f2"/>
    </linearGradient>
    <radialGradient id="er-heat" cx="18" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="er-frost" cx="46" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd8ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#5fd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#er-plate)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#8794a6" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- heat on one side, frost on the other -->
  <rect width="64" height="64" rx="14" fill="url(#er-heat)"/>
  <rect width="64" height="64" rx="14" fill="url(#er-frost)"/>

  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M7.5 20.25 L29.5 43.75 M29.5 20.25 L7.5 43.75" stroke="url(#er-fire)"/>
    <circle cx="46" cy="32" r="11" stroke="url(#er-ice)"/>
  </g>
</svg>
